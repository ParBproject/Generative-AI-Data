<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Column summary demo</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" integrity="sha384-Hl48Kq2HifOWdXEjMsKo6qxqvRLTYqIGbvlENBmkHAxZKIGCXv43H6W1jA671RzC" crossorigin="anonymous"></script>
  <style>
    html { color-scheme: light; }
    body { font-family: Arial, sans-serif; margin: 40px; background: #f5f6fa; line-height: 1.5; }
    main { max-width: 760px; }
    #chart { width: 100%; max-width: 700px; height: 450px; margin-top: 20px; }
    label { font-weight: bold; }
    #summary { margin-top: 20px; padding: 10px; background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
    a { color: #1d4ed8; }
    :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p><a href="index.html">Back to portfolio</a></p>
    <h1>Column summary demo</h1>
    <p>The paragraph is the mean, minimum, and maximum of one numeric column. It is not written by a language model. The sample is a five-row synthetic table stored in this repo.</p>
    <label for="fileInput">CSV file</label>
    <input type="file" id="fileInput" accept=".csv,text/csv">
    <button id="loadSample" type="button">Load sample dataset</button>
    <div style="margin-top:20px;">
      <label for="columnSelect">Numeric column:</label>
      <select id="columnSelect"></select>
    </div>
    <div id="chart" role="img" aria-label="Histogram of the selected numeric column"></div>
    <div id="summary" role="status" aria-live="polite">Load the sample or choose a CSV.</div>
  </main>
  <script src="js/demo-logic.js"></script>
  <script src="js/story-demo.js"></script>
</body>
</html>
