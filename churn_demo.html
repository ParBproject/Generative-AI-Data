<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Churn what-if</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js" integrity="sha384-Hl48Kq2HifOWdXEjMsKo6qxqvRLTYqIGbvlENBmkHAxZKIGCXv43H6W1jA671RzC" crossorigin="anonymous"></script>
  <style>
    html { color-scheme: light; }
    body { font-family: Arial, sans-serif; margin: 40px; background: #f5f6fa; line-height: 1.5; }
    main { max-width: 760px; }
    #gauge, #bars { width: 100%; max-width: 640px; height: 360px; margin-top: 20px; }
    label { font-weight: bold; display: block; margin-top: 20px; }
    button { margin-top: 16px; }
    a { color: #1d4ed8; }
    :focus-visible { outline: 3px solid #1d4ed8; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <p><a href="index.html">Back to portfolio</a></p>
    <h1>Churn what-if</h1>
    <p id="formula">Illustrative logistic, not fit on customer data. Bars are coefficient × (value − baseline), not SHAP.</p>
    <p>Move the sliders to compare one made-up customer with the baseline.</p>
    <label for="tenure">Tenure (months): <span id="lblTenure">12</span></label>
    <input type="range" id="tenure" min="1" max="72" value="12">
    <label for="charges">Monthly charges ($): <span id="lblCharges">70</span></label>
    <input type="range" id="charges" min="20" max="120" value="70">
    <button id="baselineBtn" type="button">Set as baseline</button>
    <p>Difference from baseline: <span id="lblDiff">0.0 percentage points</span></p>
    <div id="gauge" role="img" aria-label="Illustrative churn probability gauge"></div>
    <div id="insights" aria-live="polite" style="margin-top:30px;font-weight:bold;"></div>
    <div id="bars" role="img" aria-label="Log-odds contribution of tenure and monthly charges versus the baseline"></div>
  </main>
  <script src="js/demo-logic.js"></script>
  <script src="js/churn-demo.js"></script>
</body>
</html>
